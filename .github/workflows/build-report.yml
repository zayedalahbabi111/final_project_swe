name: Build Assignment PDF
on:
  push:
    paths:
      - 'report/UniBoard_Assignment1.md'
      - 'report/build_pdf.py'
      - '.github/workflows/build-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python report/build_pdf.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/UniBoard_Assignment1.pdf
          git diff --cached --quiet || git commit -m "docs: generate assignment PDF"
          git push