<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniBoard PoC</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:0 20px}textarea,select,input,button{width:100%;padding:10px;margin:6px 0}article{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}</style></head><body><h1>UniBoard PoC</h1><p>Browser → POST /posts → FastAPI → 201 → browser display.</p><form id="postForm"><textarea id="content" required maxlength="5000" placeholder="Write a post"></textarea><select id="audience"><option value="UNIVERSITY">University</option><option value="COMMUNITY">Community</option></select><input id="community" placeholder="Community ID (required for Community)"><button>Create post</button></form><section id="result"></section><script>document.getElementById("postForm").addEventListener("submit",async e=>{e.preventDefault();const audience_type=document.getElementById("audience").value;const body={content:document.getElementById("content").value,audience_type,community_id:document.getElementById("community").value||null};const r=await fetch("/posts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const data=await r.json();document.getElementById("result").innerHTML=r.ok?"<article><b>Created:</b> "+data.content+"<br><small>"+data.audience_type+" · "+data.created_at+"</small></article>":"<article><b>Error "+r.status+":</b> "+data.detail+"</article>";});</script></body></html>
